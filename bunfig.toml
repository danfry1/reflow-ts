[install]
# Supply-chain hardening: refuse npm package versions published more recently
# than this threshold (in seconds). 1209600 = 14 days. This is install-time
# defense-in-depth; the primary two-week gate is the Dependabot cooldown
# (.github/dependabot.yml), which holds update PRs until a version is at least
# fourteen days old — long enough for malicious releases to be found and yanked.
# An urgent security fix younger than this can be installed deliberately with
# `bun add --minimum-release-age <seconds>`, and noted in its pull request.
minimumReleaseAge = 1209600
