name: CI

on:
  push:
    branches: [main]
  # Run on every pull request regardless of base branch, so stacked PRs
  # (a feature branched off a not-yet-merged fix) still get CI.
  pull_request:

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Verify dependencies are pinned
        run: bun run lint:deps
      - run: bun run typecheck
      - run: bun run test -- --coverage
      - name: Smoke-test the bun:sqlite adapter under Bun
        run: bun run test:bun
      - run: bun run build
      - name: Smoke-test the built CLI
        run: bun run test:cli
      - name: Check package exports
        run: |
          mkdir -p package
          npm pack --ignore-scripts --pack-destination package
          bunx attw package/reflow-ts-*.tgz --ignore-rules cjs-resolves-to-esm no-resolution

  # Flags a pull request that adds a dependency with a known vulnerability or
  # an incompatible licence, before it reaches the lockfile on main.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  node-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18.18.0
      - name: Smoke test minimum Node version
        run: |
          node --input-type=module <<'EOF'
          import { createEngine } from './dist/index.mjs'

          if (typeof Symbol.asyncDispose !== 'symbol') {
            throw new Error('Symbol.asyncDispose is unavailable')
          }

          const storage = {
            initialize: async () => {},
            createRun: async () => { throw new Error('not used') },
            claimNextRun: async () => null,
            heartbeatRun: async () => true,
            sleepRun: async () => true,
            waitRun: async () => true,
            deliverEvent: async () => true,
            takeEvent: async () => null,
            getRun: async () => null,
            listRuns: async () => [],
            requeueRun: async () => false,
            getStepResults: async () => [],
            saveStepResult: async () => true,
            completeRun: async () => true,
            failRun: async () => true,
            cancelRun: async () => true,
            countRuns: async () => ({ pending: 0, running: 0, sleeping: 0, waiting: 0, completed: 0, failed: 0, cancelled: 0 }),
            deleteRuns: async () => 0,
            upsertSchedule: async (schedule) => schedule,
            claimDueSchedule: async () => null,
            deleteSchedule: async () => false,
            listSchedules: async () => [],
            close: () => {},
          }
          const engine = createEngine({ storage, workflows: [] })
          const stream = engine.stream()

          if (typeof stream[Symbol.asyncDispose] !== 'function') {
            throw new Error('ResultStream is not AsyncDisposable')
          }
          await stream[Symbol.asyncDispose]()
          EOF

  node-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Run the node:sqlite adapter tests on Node
        run: node node_modules/.bin/vitest run src/storage/__tests__/sqlite-node-builtin.test.ts

  postgres:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest Postgres still supported upstream, and the newest.
        postgres:
          - '14@sha256:8ab94f61668dc73bbab4dc13273ff2fc37e635536af62aef5306a49a9682a446'
          - '17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe'
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: reflow
          POSTGRES_PASSWORD: reflow
          POSTGRES_DB: reflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reflow"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Run the Postgres adapter tests
        env:
          REFLOW_TEST_POSTGRES_URL: postgres://reflow:reflow@localhost:5432/reflow
        run: bun run test -- src/storage/__tests__/postgres.test.ts
