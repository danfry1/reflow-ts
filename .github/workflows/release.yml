name: Release

on:
  push:
    tags:
      - 'v*'

permissions: read-all

jobs:
  # Everything that runs dependency code — install, tests, the build, the
  # package check — happens here, with read-only permissions and no way to
  # mint a publishing token. Only the packed tarball leaves this job.
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'danfry1/reflow-ts'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify dependencies are pinned
        run: bun run lint:deps

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Pack
        run: |
          mkdir -p package
          npm pack --ignore-scripts --pack-destination package

      - name: Check package exports
        run: bunx attw package/reflow-ts-*.tgz --ignore-rules cjs-resolves-to-esm no-resolution

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: package/reflow-ts-*.tgz
          if-no-files-found: error
          retention-days: 7

  # Holds the publishing token, so runs no project or dependency code: it
  # stages the tarball the build job checked, exactly as packed.
  publish:
    name: Stage on npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # npm >= 11.15 is required for staged publishing (`npm stage`).
      - run: npm i -g npm@11.15.0

      - name: Stage publish to npm
        # Uploads the tarball to npm's stage queue. Provenance is auto-generated
        # via OIDC trusted publishing (id-token: write). The version is NOT
        # installable until a maintainer approves it with a 2FA challenge:
        #   npm stage approve <id>   (or approve on npmjs.com)
        run: npm stage publish ./package/reflow-ts-*.tgz

      - name: Staged-publish approval reminder
        run: echo "::notice::Version staged to npm. Approve it (npm stage approve <id>, or on npmjs.com) with 2FA to make it installable."

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
