name: Release

on:
  push:
    tags:
      - 'v*'

permissions: read-all

jobs:
  # Everything that runs dependency code — install, tests, the build, the
  # package check — happens here, with read-only permissions and no way to
  # mint a publishing token. Only the packed tarball leaves this job.
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'danfry1/reflow-ts'

    outputs:
      dist-tag: ${{ steps.version.outputs.dist-tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
          # The whole history, to check the tagged commit is on main.
          fetch-depth: 0

      - name: Check the tag matches the package and is on main
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG_NAME" != "v$version" ]; then
            echo "::error::Tag $TAG_NAME does not match package.json version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG_NAME is not on main"
            exit 1
          fi
          # A prerelease must not become the version everyone installs.
          case "$version" in
            *-*) echo "dist-tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist-tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify dependencies are pinned
        run: bun run lint:deps

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Pack
        run: |
          mkdir -p package
          npm pack --ignore-scripts --pack-destination package

      - name: Check package exports
        run: bunx attw package/reflow-ts-*.tgz --ignore-rules cjs-resolves-to-esm no-resolution

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: package/reflow-ts-*.tgz
          if-no-files-found: error
          retention-days: 7

  # Holds the publishing token, so runs no project or dependency code, and
  # installs nothing: it stages the tarball the build job checked, exactly as
  # packed, with the npm that ships with Node. The `npm` environment lets the
  # repository restrict which tags may publish.
  publish:
    name: Stage on npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: package

      # Node 24.21 ships npm 11.19; staged publishing needs npm 11.15 or later.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org

      - name: Stage publish to npm
        # Uploads the tarball to npm's stage queue. Provenance is auto-generated
        # via OIDC trusted publishing (id-token: write). The version is NOT
        # installable until a maintainer approves it with a 2FA challenge:
        #   npm stage approve <id>   (or approve on npmjs.com)
        env:
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: npm stage publish ./package/reflow-ts-*.tgz --tag "$DIST_TAG"

      - name: Staged-publish approval reminder
        run: echo "::notice::Version staged to npm. Approve it (npm stage approve <id>, or on npmjs.com) with 2FA to make it installable."

  # Writes to the repository, so holds no publishing token and runs only gh.
  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes
