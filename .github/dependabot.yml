version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Supply-chain hardening: hold update PRs until a version has been public for
    # at least seven days, long enough for most malicious releases to be yanked.
    # Mirrors the install-time minimumReleaseAge gate in bunfig.toml.
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      # `github/codeql-action/*` sub-actions must all run the same version — the
      # analyze step fails outright if init and analyze disagree. Ungrouped,
      # Dependabot opens one PR per sub-action, and each is individually
      # unmergeable because it moves only one half of the pair.
      codeql-action:
        patterns:
          - github/codeql-action*
